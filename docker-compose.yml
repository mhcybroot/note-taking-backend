services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note_taking_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/note_taking_db
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production_12345}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@notetaking.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePassword123!}
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: note_taking_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
