version: '3.8'

services:
  note_taking_frontend:
    build:
      context: https://github.com/mhcybroot/note-taking-frontend.git#main
      dockerfile: Dockerfile
    container_name: note_taking_frontend
    restart: unless-stopped
    ports:
      - "9996:9996"
    expose:
      - "80"
      - "9996"
    depends_on:
      - backend
    networks:
      dokploy-network:
        aliases:
          - frontend
          - note_taking_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notetaking-frontend.rule=Host(`notes.mahmudulhasan.info.bd`)"
      - "traefik.http.routers.notetaking-frontend.entrypoints=websecure"
      - "traefik.http.routers.notetaking-frontend.tls=true"
      - "traefik.http.routers.notetaking-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.notetaking-frontend.loadbalancer.server.port=9996"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note_taking_backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://note_taking_mongodb:27017/note_taking_db
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_production_2026_note_taking}
      - JWT_EXPIRES_IN=1d
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@notetaking.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePassword123!}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      dokploy-network:
        aliases:
          - backend
          - note_taking_backend

  mongodb:
    image: mongo:7
    container_name: note_taking_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      dokploy-network:
        aliases:
          - mongodb
          - note_taking_mongodb

volumes:
  mongo_data:

networks:
  dokploy-network:
    external: true
